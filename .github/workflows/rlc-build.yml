name: RLC example build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build/rlc-system-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove previous build
        run: cmake -E rm -rf "$BUILD_DIR"

      - name: Configure
        run: cmake -S examples/rlc_system -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependencies
        run: python -m pip install numpy matplotlib

      - name: Run simulation
        run: "$BUILD_DIR/simulate_rlc"

      - name: Generate plots and validation
        run: python "$BUILD_DIR/plot.py"

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: rlc-simulation-results
          path: build/rlc-system-build/results/
          if-no-files-found: error