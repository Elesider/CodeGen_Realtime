name: RLC example build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build/rlc-system-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove previous build
        run: cmake -E rm -rf "$BUILD_DIR"

      - name: Configure
        run: cmake -S examples/rlc_system -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting dependencies
        run: python -m pip install numpy matplotlib

      - name: Run simulation
        run: "$BUILD_DIR/simulate_rlc"

      - name: Generate plots and validation
        run: python "$BUILD_DIR/plot.py"

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp "$BUILD_DIR/results/"* site/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>RLC Simulation Results</title>
            <style>
              body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #20252b; font: 16px/1.5 system-ui, sans-serif; }
              img { display: block; width: 100%; height: auto; }
              nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
              section { margin: 2rem 0; }
            </style>
          </head>
          <body>
            <h1>RLC Simulation Results</h1>
            <nav>
              <a href="rlc.csv">Download simulation CSV</a>
              <a href="validation.json">View validation data</a>
            </nav>
            <section>
              <h2>Capacitor voltage</h2>
              <img src="rlc_voltage.png" alt="Capacitor voltage over time">
            </section>
            <section>
              <h2>Inductor current</h2>
              <img src="rlc_current.png" alt="Inductor current over time">
            </section>
          </body>
          </html>
          EOF

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: rlc-simulation-results
          path: build/rlc-system-build/results/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4